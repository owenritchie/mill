<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mill</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f4f1ea;
        color: #2f2a24;
        font-family: ui-serif, Georgia, serif;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      h1 {
        margin: 0;
        font-size: 34px;
        font-weight: 400;
        letter-spacing: 0.01em;
      }
      p {
        margin: 0;
        font-size: 13px;
        color: #7a7166;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .bar {
        width: 132px;
        height: 2px;
        background: #e0d9cc;
        overflow: hidden;
      }
      .bar span {
        display: block;
        width: 40%;
        height: 100%;
        background: #4a5d4e;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%) }
        100% { transform: translateX(330%) }
      }
      @media (prefers-color-scheme: dark) {
        html, body { background: #1c1a17; color: #ece5d8 }
        .bar { background: #332f29 }
        p { color: #8b8377 }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mill</h1>
      <div class="bar"><span></span></div>
      <p>Starting…</p>
    </main>
  </body>
</html>
